<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task List</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>

<body class="container py-5">

<h2 class="mb-4">Task List</h2>

<!-- Add Task -->
<form method="POST" action="/add" class="mb-4">
  <input name="title" class="form-control mb-2" placeholder="Title" required>

  <textarea name="description" class="form-control mb-2"
            placeholder="Description"></textarea>

  <select name="status" class="form-control mb-2">
    <option value="Pending">Pending</option>
    <option value="Completed">Completed</option>
  </select>

  <button class="btn btn-primary">Add Task</button>
</form>

<!-- Import Excel -->
<form method="POST" action="/import" enctype="multipart/form-data" class="mb-4">
  <input type="file" name="file" required>
  <button class="btn btn-secondary">Import Excel</button>
</form>

<!-- Download JSON -->
<a href="/download" class="btn btn-success mb-4">Download as JSON</a>

<!-- Tasks Table -->
<table class="table table-bordered">
  <tr>
    <th>Title</th>
    <th>Description</th>
    <th>Status</th>
    <th>Actions</th>
  </tr>

  {% for task in tasks %}
  <tr>
    <td>{{ task.title }}</td>
    <td>{{ task.description }}</td>
    <td>{{ task.status }}</td>
    <td>
      <a href="/edit/{{ task.id }}" class="btn btn-sm btn-warning">Edit</a>
      <a href="/delete/{{ task.id }}" class="btn btn-sm btn-danger">Delete</a>
    </td>
  </tr>
  {% endfor %}
</table>

</body>
</html>
