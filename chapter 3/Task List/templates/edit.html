<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Task</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>

<body class="container py-5">

<h2>Edit Task</h2>

<form method="POST">
  <input name="title" class="form-control mb-2"
         value="{{ task.title }}" required>

  <textarea name="description" class="form-control mb-2">{{ task.description }}</textarea>

  <select name="status" class="form-control mb-2">
    <option value="Pending" {% if task.status == "Pending" %}selected{% endif %}>
      Pending
    </option>
    <option value="Completed" {% if task.status == "Completed" %}selected{% endif %}>
      Completed
    </option>
  </select>

  <button class="btn btn-primary">Update</button>
  <a href="/" class="btn btn-secondary">Cancel</a>
</form>

</body>
</html>
